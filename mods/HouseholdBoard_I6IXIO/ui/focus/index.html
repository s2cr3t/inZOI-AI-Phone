<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>focus</title>
<link rel="stylesheet" href="coui://inzoi/mod/inzoi-fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* html/body MUST keep 'background: transparent' and 'overflow: hidden'; never 'pointer-events: none'. */
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
             font-family: var(--inzoi-font-ui); font-size: 22px; }
button, input, select, textarea { font-family: var(--inzoi-font-ui); font-size: inherit; color: inherit; }

/* The talk box: across the bottom of the screen, like an RPG dialogue. */
#app-root { position: absolute; left: 330px; top: 740px; width: 1260px; height: 300px;
            display: flex; flex-direction: column; overflow: hidden;
            background: rgba(14, 16, 24, 0.86); border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px; color: #f4f1ea; }
#title-bar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
             padding: 10px 18px 6px 22px; cursor: move;
             user-select: none; -webkit-user-select: none; }
#title-text { font-size: 24px; font-weight: bold; color: #ffd98a; }
#title-sub { font-size: 16px; color: rgba(244, 241, 234, 0.55); margin-left: 12px; font-weight: normal; }
#title-buttons { display: flex; align-items: center; }
#minimize-btn { display: none; }
#close-btn { cursor: pointer; font-size: 16px; font-weight: bold; line-height: 1.4;
             font-family: var(--inzoi-font-mono, Consolas, monospace);
             background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22);
             color: #fff; border-radius: 6px; padding: 2px 10px; }
#close-btn:hover { background: rgba(200, 60, 60, 0.55); }
#content { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 22px 16px 22px; overflow: hidden; }

#talk-log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 8px 0; overscroll-behavior: contain; }
.line { margin: 4px 0; line-height: 1.45; }
.line .who { font-weight: bold; margin-right: 8px; }
.line.theirs .who { color: #ffd98a; }
.line.mine { color: rgba(244, 241, 234, 0.72); }
.line.mine .who { color: #9fd0ff; }
.line.note { color: rgba(244, 241, 234, 0.5); font-size: 18px; }
#talk-state { height: 26px; font-size: 18px; color: rgba(244, 241, 234, 0.6); }
#talk-state.err { color: #ff9a8a; }

#compose { display: flex; align-items: center; flex-shrink: 0; }
#talk-box { flex: 1; height: 50px; font-family: var(--inzoi-font-ui); resize: none; padding: 10px 14px; border-radius: 12px; outline: none;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
#talk-box:focus { border-color: rgba(255, 217, 138, 0.7); }
#talk-send { margin-left: 12px; height: 50px; padding: 0 26px; border-radius: 12px; cursor: pointer;
             background: #d9a441; border: none; color: #1a1408; font-weight: bold; }
#talk-send.off { background: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.5); }
/* Voice input (lib/voice.js): what the microphone is doing, above the input. */
@keyframes voice-pulse { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }
#voice-bar { display: none; flex-shrink: 0; align-items: center; height: 30px; font-size: 17px; color: #ffd98a; }
#voice-bar.on { display: flex; }
.voice-dot { width: 12px; height: 12px; border-radius: 6px; margin-right: 10px; background: #ff6b5e; animation: voice-pulse 1s ease-in-out infinite; }
#voice-bar.thinking .voice-dot { background: #ffd98a; }
#voice-bar.heard .voice-dot { background: #7fcf8f; }
#voice-bar.err { color: #ff9a8a; }
#voice-bar.err .voice-dot { background: #8a8a8a; }
#talk-hint { margin-left: 14px; font-size: 16px; color: rgba(244, 241, 234, 0.45); white-space: nowrap; }

/* A lesson (lib/ielts.js): the term's textbook contents on the left (display only), and the
   teacher's question on a card above the talk. */
#syllabus { position: absolute; left: 24px; top: 120px; width: 290px; display: none; overflow: hidden;
            background: rgba(14, 16, 24, 0.82); border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px; color: #f4f1ea; padding: 14px 16px 12px 16px; }
#syllabus.on { display: block; }
.sy-head { font-size: 20px; font-weight: bold; color: #ffd98a; }
.sy-sub { font-size: 15px; color: rgba(244, 241, 234, 0.55); margin: 2px 0 10px 0; }
.sy-unit { display: flex; align-items: center; font-size: 17px; line-height: 1.5; color: rgba(244, 241, 234, 0.5); }
.sy-unit.done { color: rgba(244, 241, 234, 0.75); }
.sy-unit.now { color: #fff; font-weight: bold; }
.sy-dot { width: 10px; height: 10px; border-radius: 5px; margin-right: 10px; flex-shrink: 0; background: rgba(255, 255, 255, 0.22); }
.sy-unit.done .sy-dot { background: #7fcf8f; }
.sy-unit.now .sy-dot { background: #ffd98a; }
.sy-no { width: 62px; flex-shrink: 0; }
.sy-now { margin: 4px 0 8px 20px; padding: 6px 0 6px 12px; border-left: 2px solid rgba(255, 217, 138, 0.5); }
.sy-gram { font-size: 15px; color: rgba(244, 241, 234, 0.65); margin-bottom: 4px; }
.sy-pt { display: flex; align-items: center; font-size: 15px; line-height: 1.55; color: rgba(244, 241, 234, 0.55); }
.sy-pt.done { color: rgba(244, 241, 234, 0.85); }
.sy-pt.now { color: #ffd98a; }
.sy-pt .sy-dot { width: 7px; height: 7px; border-radius: 4px; margin-right: 8px; }
.sy-pt.done .sy-dot { background: #7fcf8f; }
.sy-pt.now .sy-dot { background: #ffd98a; }
.sy-res { margin-left: 8px; font-size: 13px; font-weight: bold; }
.sy-res.right { color: #7fcf8f; }
.sy-res.wrong { color: #ff9a8a; }
.sy-foot { margin-top: 10px; font-size: 15px; color: rgba(244, 241, 234, 0.6); }

#ask-card { display: none; flex-shrink: 0; margin: 2px 0 8px 0; padding: 10px 16px 12px 16px; border-radius: 14px;
            background: rgba(255, 217, 138, 0.10); border: 1px solid rgba(255, 217, 138, 0.45); }
#ask-card.on { display: block; }
.ask-tag { font-size: 15px; color: #ffd98a; font-weight: bold; }
.ask-prompt { font-size: 22px; line-height: 1.4; margin: 4px 0 8px 0; color: #fff; }
.ask-opts { display: flex; }
.ask-opt { flex: 1; margin-right: 10px; height: 46px; border-radius: 10px; cursor: pointer; overflow: hidden; white-space: nowrap;
           background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; padding: 0 10px; }
.ask-opt:hover { background: rgba(255, 217, 138, 0.30); border-color: rgba(255, 217, 138, 0.8); }
.ask-opt.picked { background: #d9a441; color: #1a1408; font-weight: bold; }
.ask-opt.off { cursor: default; opacity: 0.6; }
.ask-hint { font-size: 16px; color: rgba(244, 241, 234, 0.6); }

/* The textbook (a lesson, lib/ielts.js): open on the right at the page of the point being taught,
   display only. The frame of each page is drawn here (app.js tb*); what is printed on it comes
   from the lesson board. Its pages turn by themselves as the teacher goes on. */
@keyframes tb-slide-in { from { opacity: 0; transform: translateX(140px); } to { opacity: 1; transform: translateX(0px); } }
@keyframes tb-fold { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes tb-shade { from { opacity: 0; } to { opacity: 1; } }
@keyframes tb-ink { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0px); } }
@keyframes tb-wait { 0% { opacity: 0.3; } 50% { opacity: 0.75; } 100% { opacity: 0.3; } }
@keyframes tb-stamp-in { 0% { opacity: 0; transform: scale(2.4); } 70% { opacity: 1; transform: scale(0.94); } 100% { opacity: 1; transform: scale(1); } }
#textbook { position: absolute; left: 1296px; top: 24px; width: 600px; height: 560px; display: none; color: #2b2a33; }
#textbook.on { display: block; animation: tb-slide-in 0.55s ease-out both; }
.tb-board { position: absolute; left: 0; top: 0; width: 566px; height: 560px; border-radius: 6px 12px 12px 6px;
            background: #1f4d4a; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55); }
.tb-edge { position: absolute; left: 30px; top: 14px; width: 530px; height: 540px; border-radius: 2px 8px 8px 2px; background: #e4dcc6; }
.tb-host { position: absolute; left: 26px; top: 10px; width: 530px; height: 540px; }
.tb-ring { position: absolute; left: 8px; width: 34px; height: 12px; border-radius: 6px; z-index: 6;
           background: #c9ced6; border: 1px solid #8d939c; box-shadow: 0 2px 3px rgba(0, 0, 0, 0.35); }
.tb-tab { position: absolute; left: 552px; width: 38px; height: 40px; border-radius: 0 8px 8px 0; z-index: 0;
          background: #b9b29c; color: #5c5746; font-size: 15px; font-weight: bold; text-align: center; line-height: 40px; }
.tb-tab.done { background: #d9d2bb; color: #4a6b4f; }
.tb-tab.now { left: 556px; width: 44px; background: #ffd98a; color: #5a3d00; }

.tb-page { position: absolute; left: 0; top: 0; width: 530px; height: 540px; overflow: hidden; display: flex; flex-direction: column;
           border-radius: 2px 8px 8px 2px; background: #fbf6e9; transform-origin: 0 50%; z-index: 2; }
.tb-page.tb-out { z-index: 4; animation: tb-fold 0.6s ease-in both; }
.tb-shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; opacity: 0;
            background-image: linear-gradient(90deg, rgba(40, 30, 10, 0) 30%, rgba(40, 30, 10, 0.45) 100%); }
.tb-out .tb-shade { animation: tb-shade 0.6s ease-in both; }
.tb-head { flex-shrink: 0; height: 34px; padding: 0 18px 0 30px; display: flex; align-items: center; justify-content: space-between;
           font-size: 14px; color: #fff; background: #2f7f86; }
.k-grammar .tb-head { background: #6a4fa3; }
.k-cover .tb-head { background: #c8553d; }
.k-sum .tb-head { background: #b07f1a; }
.tb-head-r { font-size: 12px; letter-spacing: 2px; opacity: 0.85; }
.tb-body { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: 12px 22px 8px 34px; position: relative; }
/* Set tighter when the print runs past the foot (app.js tbFit). */
.tb-page.tight .tb-body { padding-top: 8px; }
.tb-page.tight .tb-word { font-size: 34px; line-height: 42px; }
.tb-page.tight .tb-zh { font-size: 19px; line-height: 26px; }
.tb-page.tight .tb-note { margin-top: 5px; padding: 4px 10px; font-size: 14px; line-height: 20px; }
.tb-page.tight .tb-h { margin-top: 6px; }
.tb-page.tight .tb-coll { line-height: 21px; }
.tb-page.tight .tb-ex-en { font-size: 15px; line-height: 21px; }
.tb-page.tight .tb-ex-zh { font-size: 13px; line-height: 18px; }
.tb-page.tight .tb-family { margin-top: 4px; font-size: 13px; }
.tb-page.tight .tb-bottom { margin-top: 6px; }
.tb-page.tight .tb-sticky { padding: 6px 8px 8px 8px; font-size: 13px; line-height: 18px; }
.tb-page.tight .tb-err-bad, .tb-page.tight .tb-err-ok { font-size: 13px; line-height: 18px; }
.tb-page.tight .tb-g-name { font-size: 22px; line-height: 30px; }
.tb-page.tight .tb-formula { padding: 4px 12px; font-size: 16px; line-height: 22px; }
.tb-page.tight .tb-form { margin-top: 3px; }
.tb-page.tight .tb-form-en { font-size: 14px; line-height: 19px; }
.tb-page.tight .tb-form-zh { font-size: 12px; line-height: 16px; }
.tb-page.tight .tb-signal { line-height: 20px; font-size: 13px; }
.tb-page.tight .tb-rhyme { margin-top: 5px; font-size: 14px; line-height: 20px; }
.tb-page.tight .tb-cv-no { width: 86px; height: 86px; }
.tb-page.tight .tb-cv-no-k { margin-top: 10px; }
.tb-page.tight .tb-cv-no-n { font-size: 42px; line-height: 48px; }
.tb-page.tight .tb-cv-topic { font-size: 26px; line-height: 34px; }
.tb-page.tight .tb-cv-pt { line-height: 26px; }
.tb-page.tight .tb-bubble { padding: 6px 12px; }
.tb-page.tight .tb-sum-row { line-height: 28px; }
.tb-page.tighter .tb-word { font-size: 30px; line-height: 36px; }
.tb-page.tighter .tb-note, .tb-page.tighter .tb-coll-zh, .tb-page.tighter .tb-sticky, .tb-page.tighter .tb-err-bad, .tb-page.tighter .tb-err-ok { font-size: 12px; line-height: 17px; }
.tb-page.tighter .tb-coll { line-height: 19px; }
.tb-page.tighter .tb-coll-en, .tb-page.tighter .tb-ex-en { font-size: 14px; line-height: 19px; }
.tb-page.tighter .tb-h { margin-top: 4px; }
.tb-page.tighter .tb-form-en { font-size: 13px; line-height: 17px; }
.tb-page.tighter .tb-cv-pt { line-height: 23px; }
.tb-foot { flex-shrink: 0; height: 26px; padding: 0 22px 0 34px; display: flex; align-items: center; justify-content: space-between;
           font-size: 12px; color: #9a927c; border-top: 1px solid #e6dfca; }
.tb-in { animation: tb-ink 0.4s ease-out both; }
.tb-in.d1 { animation-delay: 0.1s; }
.tb-in.d2 { animation-delay: 0.22s; }
.tb-in.d3 { animation-delay: 0.34s; }
.tb-in.d4 { animation-delay: 0.46s; }
.tb-in.d5 { animation-delay: 0.58s; }
.tb-in.d6 { animation-delay: 0.7s; }
.tb-bar { height: 12px; margin: 8px 0; border-radius: 6px; background: #d8d0b8; animation: tb-wait 1.4s ease-in-out infinite; }
.tb-bar.s { width: 55%; }
.tb-wait-note { font-size: 12px; color: #a59d86; margin-top: 6px; }

.tb-tag { font-size: 12px; font-weight: bold; letter-spacing: 3px; color: #2f7f86; }
.k-grammar .tb-tag { color: #6a4fa3; }
.tb-word-row { display: flex; align-items: baseline; margin-top: 2px; }
.tb-word { font-size: 40px; line-height: 50px; font-weight: bold; color: #1c1b22; }
.tb-pos { margin-left: 12px; font-size: 18px; font-style: italic; color: #7b745f; }
.tb-syll { margin-left: 14px; font-size: 15px; letter-spacing: 1px; color: #9a927c; font-family: var(--inzoi-font-mono, Consolas, monospace); }
.tb-zh-row { display: flex; }
.tb-zh { font-size: 22px; line-height: 30px; font-weight: bold; color: #b0402c; border-bottom: 4px solid #ffe08a; }
.tb-note { margin-top: 8px; padding: 6px 10px; font-size: 15px; line-height: 22px; color: #3d3b46;
           background: rgba(47, 127, 134, 0.09); border-left: 3px solid #2f7f86; }
.k-grammar .tb-note { background: rgba(106, 79, 163, 0.09); border-left-color: #6a4fa3; }
.tb-h { margin-top: 9px; margin-bottom: 2px; font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #2f7f86; }
.k-grammar .tb-h { color: #6a4fa3; }
.k-cover .tb-h { color: #c8553d; }
.k-sum .tb-h { color: #b07f1a; }
.tb-coll { display: flex; align-items: baseline; line-height: 24px; }
.tb-coll-dot { width: 6px; height: 6px; border-radius: 3px; margin-right: 8px; background: #2f7f86; flex-shrink: 0; }
.tb-coll-en { font-size: 16px; font-weight: bold; color: #26252d; }
.tb-coll-zh { margin-left: 10px; font-size: 14px; color: #7b745f; }
.tb-ex-en { font-size: 17px; line-height: 24px; color: #26252d; }
.tb-hl { background: #ffe58a; font-weight: bold; }
.tb-ex-zh { font-size: 14px; line-height: 20px; color: #7b745f; }
.tb-family { margin-top: 6px; font-size: 14px; color: #5c5746; }
.tb-family-k { font-weight: bold; color: #2f7f86; margin-right: 8px; }
.tb-bottom { display: flex; margin-top: 10px; }
.tb-sticky-wrap { width: 200px; flex-shrink: 0; transform: rotate(-2deg); }
.tb-sticky { padding: 8px 10px 10px 10px; background: #fff3a6; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18); font-size: 14px; line-height: 20px; color: #4a4320; }
.tb-sticky-k { font-size: 12px; font-weight: bold; color: #a07a00; }
.tb-err { flex: 1; min-width: 0; margin-left: 16px; }
.tb-err-k { font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #b0402c; margin-bottom: 4px; }
.tb-err-row { display: flex; align-items: flex-start; margin-bottom: 4px; }
.tb-badge { flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; margin-right: 8px; font-size: 13px; font-weight: bold;
            line-height: 22px; text-align: center; color: #fff; background: #9a927c; }
.tb-badge.bad { background: #c8553d; }
.tb-badge.ok { background: #3f8f5a; }
.tb-err-bad { font-size: 14px; line-height: 20px; color: #a8452f; text-decoration: line-through; }
.tb-err-ok { font-size: 14px; line-height: 20px; color: #2f6f45; font-weight: bold; }

.tb-g-name { font-size: 26px; line-height: 34px; font-weight: bold; color: #1c1b22; margin-top: 2px; }
.tb-g-zh { font-size: 15px; line-height: 20px; color: #7b745f; }
.tb-rhyme { margin-top: 8px; font-size: 15px; line-height: 22px; color: #4a4320; }
.tb-rhyme-k { margin-right: 8px; padding: 1px 8px; border-radius: 4px; background: #fff3a6; font-size: 13px; font-weight: bold; color: #a07a00; }
.k-grammar .tb-bottom { margin-top: 6px; }
.k-grammar .tb-err { margin-left: 0; }
.k-grammar .tb-note { font-size: 14px; line-height: 20px; margin-top: 6px; }
.tb-formula { margin-top: 6px; padding: 6px 14px; border-radius: 6px; background: #24504a; border: 3px solid #8a6a3c;
              color: #f3f0d8; font-size: 18px; line-height: 26px; text-align: center; font-family: var(--inzoi-font-mono, Consolas, monospace); }
.tb-form { display: flex; align-items: flex-start; margin-top: 5px; }
.tb-form-label { flex-shrink: 0; width: 44px; height: 22px; border-radius: 4px; margin-right: 10px; margin-top: 1px;
                 font-size: 13px; font-weight: bold; line-height: 22px; text-align: center; color: #fff; background: #3f8f5a; }
.tb-form-label.f1 { background: #c8553d; }
.tb-form-label.f2 { background: #3d6fb0; }
.tb-form-en { font-size: 15px; line-height: 21px; color: #26252d; }
.tb-form-zh { font-size: 13px; line-height: 18px; color: #7b745f; }
.tb-signals { display: flex; flex-wrap: wrap; }
.tb-signal { margin: 2px 6px 2px 0; padding: 1px 9px; border-radius: 11px; font-size: 14px; line-height: 22px;
             background: rgba(106, 79, 163, 0.12); color: #4b3780; }

.tb-cv-top { display: flex; align-items: center; margin-top: 6px; }
.tb-cv-no { flex-shrink: 0; width: 104px; height: 104px; border-radius: 10px; background: #c8553d; color: #fff; text-align: center; }
.tb-cv-no-k { margin-top: 14px; font-size: 14px; letter-spacing: 4px; }
.tb-cv-no-n { font-size: 52px; line-height: 58px; font-weight: bold; }
.tb-cv-main { margin-left: 18px; min-width: 0; }
.tb-cv-topic { font-size: 30px; line-height: 40px; font-weight: bold; color: #1c1b22; }
.tb-cv-gram { font-size: 15px; color: #7b745f; margin-top: 2px; }
.tb-cv-title { font-size: 17px; color: #b0402c; font-weight: bold; margin-top: 4px; }
.tb-cv-goal { font-size: 16px; line-height: 23px; color: #3d3b46; }
.tb-cv-pt { display: flex; align-items: center; line-height: 30px; }
.tb-cv-pt-n { flex-shrink: 0; width: 24px; height: 24px; border-radius: 12px; margin-right: 10px; background: #2f7f86; color: #fff;
              font-size: 14px; font-weight: bold; line-height: 24px; text-align: center; }
.tb-cv-pt-n.grammar { background: #6a4fa3; }
.tb-cv-pt-en { font-size: 17px; font-weight: bold; color: #26252d; }
.tb-cv-pt-zh { margin-left: 10px; font-size: 14px; color: #7b745f; }
.tb-bubble { margin-top: 4px; padding: 10px 14px; border-radius: 14px 14px 14px 2px; background: #fff; border: 2px solid #e6c9a0; }
.tb-bubble-en { font-size: 18px; line-height: 25px; font-style: italic; color: #26252d; }
.tb-bubble-zh { font-size: 14px; color: #7b745f; }

.tb-sum-top { display: flex; align-items: center; margin-top: 4px; }
.tb-sum-ring { flex-shrink: 0; width: 96px; height: 96px; border-radius: 48px; border: 6px solid #e0b24a; text-align: center; background: #fff8e2; }
.tb-sum-score { margin-top: 16px; font-size: 30px; line-height: 36px; font-weight: bold; color: #8a5d00; }
.tb-sum-score-k { font-size: 12px; color: #a08040; }
.tb-sum-title { margin-left: 18px; }
.tb-sum-h1 { font-size: 28px; line-height: 38px; font-weight: bold; color: #1c1b22; }
.tb-sum-h2 { font-size: 15px; color: #7b745f; }
.tb-sum-row { display: flex; align-items: center; line-height: 32px; border-bottom: 1px dashed #e0d8c0; }
.tb-sum-en { font-size: 17px; font-weight: bold; color: #26252d; }
.tb-sum-zh { margin-left: 10px; font-size: 14px; color: #7b745f; }
.tb-home { margin-top: 6px; padding: 8px 12px; border: 2px dashed #d0a85a; border-radius: 8px; font-size: 15px; line-height: 22px; color: #4a4320; background: #fffaf0; }
